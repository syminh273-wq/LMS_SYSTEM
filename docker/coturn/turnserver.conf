# Local/dev TURN server for testing WebRTC media relay (see
# docs/features/classroom/RTC_MEETING_LIVE_DETECTION_BUG.md).
# NOT hardened for production — static long-term credentials, no TLS cert.

listening-port=3478
min-port=49160
max-port=49200

# Static long-term credential auth (lt-cred-mech).
# Must match NEXT_PUBLIC_TURN_USERNAME / NEXT_PUBLIC_TURN_CREDENTIAL in the
# frontend .env.local files.
lt-cred-mech
user=turnuser:turnpass
realm=lms.local

# Log to stdout so `docker compose logs` shows connection/relay activity.
log-file=stdout
verbose

# No TURNS/TLS in local dev — plain turn: only. Add cert+turns listener
# before using this outside a trusted local network.
no-tls
no-dtls

# Docker containers don't have a stable "external" IP to auto-detect;
# fixed to loopback since this is for same-machine local testing only.
external-ip=127.0.0.1

# coturn blocks relaying to loopback peers by default (anti-SSRF hardening).
# Needed here because both WebRTC peers are on the same dev machine (127.0.0.1).
# Remove this once testing against real, non-loopback client IPs.
allow-loopback-peers
no-multicast-peers

# coturn refuses to start with allow-loopback-peers unless the CLI telnet
# management interface (port 5766) either has a password or is disabled.
# We don't use the CLI, so disable it outright.
no-cli
